<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>Juvelnic Counter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 32px}h1{font-size:25px;margin:4px 0 2px}.sub{color:#94a3b8;font-size:13px;margin-bottom:16px}.card{background:#111827;border:1px solid #263244;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px #0003}.total{text-align:center}.total .label{color:#94a3b8;font-size:13px}.kg{font-size:52px;font-weight:800;letter-spacing:-2px;margin:2px 0}.stats{display:flex;justify-content:space-around;text-align:center;margin-top:12px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#94a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:16px;padding:17px 8px;background:#1f2937;color:#fff;font-size:20px;font-weight:700;cursor:pointer}.btn:active{transform:scale(.98)}.green{background:#166534}.blue{background:#1d4ed8}.red{background:#991b1b}.inputrow{display:flex;gap:8px;margin-top:10px}.inputrow input{flex:1;min-width:0;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:14px;padding:15px;font-size:19px}.inputrow button{width:110px}.timer{text-align:center;font-variant-numeric:tabular-nums;font-size:30px;font-weight:800;margin:6px 0 12px}.smallrow{display:flex;gap:8px}.smallrow button{flex:1;padding:12px;border:0;border-radius:13px;background:#1f2937;color:#fff;font-weight:650;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{padding:12px;border:0;border-radius:13px;color:#fff;background:#1f2937;cursor:pointer}.note{font-size:11px;color:#64748b;text-align:center;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid #263244;text-align:left}th{color:#94a3b8;font-weight:500}
</style>
</head>
<body>
<div class="app">
<h1>🎣 Juvelnic Counter</h1><div class="sub">Contor rapid pentru concursuri feeder</div>

<div class="card total"><div class="label">TOTAL JUVELNIC</div><div class="kg" id="total">0,000 kg</div>
<div class="stats"><div class="stat"><b id="count">0</b><span>PEȘTI</span></div><div class="stat"><b id="avg">0 g</b><span>MEDIE</span></div><div class="stat"><b id="rate">0,00</b><span>KG / ORĂ</span></div></div></div>

<div class="card"><div class="timer" id="timer">00:00:00</div>
<div class="smallrow"><button onclick="startTimer()">▶ Start</button><button onclick="pauseTimer()">⏸ Pauză</button><button onclick="resetTimer()">↺ Reset</button></div>
<div style="margin-top:12px"><div style="font-size:12px;color:#94a3b8;margin-bottom:8px">CRONOMETRU INTERVAL</div>
<div class="grid">
<button class="btn" onclick="startCountdown(150)">2,5 min</button>
<button class="btn" onclick="startCountdown(180)">3 min</button>
<button class="btn" onclick="startCountdown(300)">5 min</button>
<button class="btn" onclick="startCountdown(420)">7 min</button>
<button class="btn green" onclick="startCountdown(600)">10 min</button>
<button class="btn red" onclick="stopCountdown()">■ Stop</button>
</div>
<div id="countdown" style="text-align:center;font-size:28px;font-weight:800;margin-top:12px">00:00</div></div></div>

<div class="card"><div class="grid">
<button class="btn" onclick="addFish(100)">+100 g</button><button class="btn" onclick="addFish(250)">+250 g</button>
<button class="btn" onclick="addFish(500)">+500 g</button><button class="btn green" onclick="addFish(1000)">+1 kg</button>
</div><div class="inputrow"><input id="custom" inputmode="decimal" placeholder="Greutate exactă (g)"><button class="btn blue" onclick="addCustom()">Adaugă</button></div></div>

<div class="card"><div class="actions">
<button class="red" onclick="undoFish()">↩ Ultimul pește</button><button onclick="clearAll()">🗑 Șterge tot</button>
<button onclick="exportCSV()">⬇ Export CSV</button><button onclick="saveSession()">💾 Salvează</button>
</div></div>

<div class="card"><table><thead><tr><th>#</th><th>Ora</th><th>Greutate</th><th>Total</th></tr></thead><tbody id="log"></tbody></table>
<div class="note">Datele sunt salvate automat pe telefon.</div></div>
</div>

<script>
var fish=[];
var elapsed=0;
var running=false;
var startedAt=0;
var timerInt=null;
var countdownInt=null;
var countdownEnd=0;

function loadData(){
 try{fish=JSON.parse(localStorage.getItem("juvelnicFish")||"[]");}catch(e){fish=[];}
 elapsed=parseInt(localStorage.getItem("juvelnicElapsed")||"0",10)||0;
}
function saveData(){localStorage.setItem("juvelnicFish",JSON.stringify(fish));localStorage.setItem("juvelnicElapsed",String(getElapsed()));}
function total(){var t=0;for(var i=0;i<fish.length;i++)t+=Number(fish[i].g)||0;return t;}
function kg(g){return (g/1000).toFixed(3).replace(".",",")+" kg";}
function getElapsed(){return running?elapsed+(Date.now()-startedAt):elapsed;}
function render(){
 var t=total(),c=fish.length,h=getElapsed()/3600000;
 document.getElementById("total").textContent=kg(t);
 document.getElementById("count").textContent=c;
 document.getElementById("avg").textContent=c?Math.round(t/c)+" g":"0 g";
 document.getElementById("rate").textContent=h?(t/1000/h).toFixed(2).replace(".",","):"0,00";
 var out="";
 for(var i=fish.length-1;i>=0;i--)out+="<tr><td>"+(i+1)+"</td><td>"+fish[i].time+"</td><td>"+fish[i].g+" g</td><td>"+kg(fish[i].running)+"</td></tr>";
 document.getElementById("log").innerHTML=out;
 saveData();
 updateTimerOnly();
}
function addFish(g){
 g=Number(g);
 if(!g||g<=0)return;
 fish.push({g:g,time:new Date().toLocaleTimeString("ro-RO"),running:total()+g});
 if(!running)startTimer();
 render();
}
function addCustom(){
 var v=document.getElementById("custom").value.trim().replace(",",".");
 var g=parseFloat(v);
 if(g>0){addFish(g);document.getElementById("custom").value="";}
}
function undoFish(){if(fish.length){fish.pop();render();}}
function clearAll(){
 if(confirm("Ștergi toți peștii și timpul?")){
  fish=[];elapsed=0;running=false;startedAt=0;clearInterval(timerInt);saveData();render();
 }
}
function updateTimerOnly(){
 var s=Math.floor(getElapsed()/1000),h=Math.floor(s/3600);s%=3600;var m=Math.floor(s/60);s%=60;
 document.getElementById("timer").textContent=[h,m,s].map(function(x){return String(x).padStart(2,"0")}).join(":");
}
function startTimer(){
 if(!running){startedAt=Date.now();running=true;clearInterval(timerInt);timerInt=setInterval(function(){updateTimerOnly();renderStatsOnly();},1000);}
}
function pauseTimer(){if(running){elapsed=getElapsed();running=false;clearInterval(timerInt);saveData();updateTimerOnly();}}
function resetTimer(){running=false;clearInterval(timerInt);elapsed=0;startedAt=0;saveData();updateTimerOnly();renderStatsOnly();}
function renderStatsOnly(){
 var t=total(),c=fish.length,h=getElapsed()/3600000;
 document.getElementById("rate").textContent=h?(t/1000/h).toFixed(2).replace(".",","):"0,00";
}
function startCountdown(seconds){
 clearInterval(countdownInt);
 countdownEnd=Date.now()+seconds*1000;
 updateCountdown();
 countdownInt=setInterval(function(){
  updateCountdown();
  if(Date.now()>=countdownEnd){clearInterval(countdownInt);document.getElementById("countdown").textContent="00:00";alert("⏱️ Timpul a expirat!");}
 },250);
}
function updateCountdown(){
 var left=Math.max(0,countdownEnd-Date.now()),sec=Math.ceil(left/1000),m=Math.floor(sec/60),s=sec%60;
 document.getElementById("countdown").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function stopCountdown(){clearInterval(countdownInt);countdownEnd=0;document.getElementById("countdown").textContent="00:00";}
function saveSession(){saveData();alert("Partida salvată.");}
function exportCSV(){
 var rows=["Nr;Ora;Greutate (g);Total (g)"];
 for(var i=0;i<fish.length;i++)rows.push((i+1)+";"+fish[i].time+";"+fish[i].g+";"+fish[i].running);
 var blob=new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
 var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="juvelnic.csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
loadData();render();
</script>
</body>
</html>
